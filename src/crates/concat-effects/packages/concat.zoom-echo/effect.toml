format = 2

[effect]
id = "concat.zoom-echo"
name = "Zoom Echo"
kind = "transition"
category = "Zoom"
order = 16
description = "Radial zoom blur with echo trail and punchy contrast peak across the cut."

[[param]]
key = "blur_strength"
label = "Blur Strength"
min = 0.0
max = 0.5
default = 0.18
step = 0.01

[[param]]
key = "zoom_scale_a"
label = "Zoom Scale"
min = 0.6
max = 1.0
default = 0.82
step = 0.01

[[param]]
key = "sat_boost"
label = "Saturation Boost"
min = 0.0
max = 1.0
default = 0.45
step = 0.01

[[param]]
key = "contrast_boost"
label = "Contrast Boost"
min = 0.0
max = 0.6
default = 0.20
step = 0.01

[transition]
entry = "effect.wgsl"
xfade = "zoomin"
fallback = "cross-fade"
