format = 2

[effect]
id = "concat.cursor-trail"
name = "Cursor Trail"
version = 1
kind = "effect"
category = "Text"
order = 3
description = "Reveals characters with a directional motion-blur trail and glowing cursor edge."

[[param]]
key = "duration"
label = "Duration"
min = 0.05
max = 5
default = 0.63
step = 0.05
unit = "s"

[[param]]
key = "start"
label = "Start"
min = 0
max = 36000
default = 0
step = 0.01
unit = "s"

[[param]]
key = "steps"
label = "Steps"
min = 1
max = 1000
default = 1
step = 1

[wgsl]
entry = "effect.wgsl"
